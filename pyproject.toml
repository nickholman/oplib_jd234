[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nickholman-oplib_jd234"
version = "0.1.0"
description = "把候选项映射到类别上，算出算子库维护工程师·评测集泄漏与过拟合的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nickholman" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nickholman.github.io"
Repository = "https://github.com/nickholman/oplib_jd234"
Issues = "https://github.com/nickholman/oplib_jd234/issues"

[project.scripts]
oplib_jd234 = "oplib_jd234:main"

[tool.setuptools]
py-modules = ["oplib_jd234"]
